<div class="notifications-page page-enter">
  <div class="page-header">
    <div>
      <h1 class="section-title">{{ langService.t('notifications.title') }}</h1>
      <p class="section-subtitle">{{ langService.t('notifications.page_subtitle', [unreadCount]) }}</p>
    </div>
    <button *ngIf="unreadCount > 0" class="btn-secondary" (click)="markAllRead()">
      <span class="material-icons">done_all</span> {{ langService.t('notifications.mark_all') }}
    </button>
  </div>

  <!-- Notifications skeleton -->
  <div *ngIf="loading()" class="nfsk-list">
    <div *ngFor="let i of [1,2,3,4,5,6,7]" class="nfsk-item">
      <!-- Unread indicator dot -->
      <div class="sk sk--circle" style="width:8px;height:8px;flex-shrink:0;"></div>
      <!-- Icon avatar -->
      <div class="sk sk--rounded" style="width:40px;height:40px;flex-shrink:0;"></div>
      <!-- Content -->
      <div style="flex:1;display:flex;flex-direction:column;gap:7px;min-width:0;">
        <div class="sk" [style.width]="(40 + i*7) + '%'" style="height:15px;border-radius:4px;"></div>
        <div class="sk" [style.width]="(55 + (i % 3)*10) + '%'" style="height:13px;border-radius:4px;"></div>
      </div>
      <!-- Timestamp + action -->
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;">
        <div class="sk" style="width:46px;height:12px;border-radius:4px;"></div>
        <div class="sk sk--rounded" style="width:24px;height:24px;"></div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading()" class="notif-list">
    <div *ngFor="let n of notifications(); trackBy: trackById" class="notif-item" [class.notif-item--unread]="!n.isRead" (click)="markRead(n.id)">
      <div class="notif-item__icon" [style.background]="getColor(n.type) + '18'" [style.color]="getColor(n.type)">
        <span class="material-icons">{{ getIcon(n.type) }}</span>
      </div>
      <div class="notif-item__content">
        <p class="notif-item__title">{{ n.title }}</p>
        <p class="notif-item__message">{{ n.message }}</p>
        <span class="notif-item__time">{{ formatTime(n.createdAt) }}</span>
      </div>
      <div *ngIf="!n.isRead" class="notif-item__dot"></div>
    </div>

    <div *ngIf="notifications().length === 0" class="notif-empty">
      <span class="material-icons">notifications_none</span>
      <p>{{ langService.t('notifications.empty') }}</p>
    </div>
  </div>
</div>
