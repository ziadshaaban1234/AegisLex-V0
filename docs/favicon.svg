<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730d4"/>
      <stop offset="55%" stop-color="#4e4eeb"/>
      <stop offset="100%" stop-color="#7c6ff7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="36" rx="14" fill="url(#shine)"/>
  <!-- Shield outline -->
  <path d="M32 7 L13 14.5 L13 30 C13 42 21 52 32 55.5 C43 52 51 42 51 30 L51 14.5 Z"
        fill="white" opacity="0.1"/>
  <path d="M32 10 L15 17 L15 30 C15 41 22.5 50 32 53 C41.5 50 49 41 49 30 L49 17 Z"
        fill="none" stroke="white" stroke-width="1.5" opacity="0.55"/>
  <!-- Center rod -->
  <line x1="32" y1="16" x2="32" y2="44" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Slightly tilted beam (−5deg gives dynamic feel) -->
  <line x1="13" y1="29.2" x2="51" y2="26.8" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
  <!-- Gold pivot -->
  <circle cx="32" cy="28" r="3" fill="#fbbf24"/>
  <!-- Top finial -->
  <circle cx="32" cy="16" r="2" fill="#fbbf24" opacity="0.8"/>
  <!-- Left pan chains -->
  <line x1="17" y1="29.2" x2="14" y2="37" stroke="white" stroke-width="1.3" opacity="0.55" stroke-dasharray="2 2"/>
  <line x1="17" y1="29.2" x2="20" y2="37" stroke="white" stroke-width="1.3" opacity="0.55" stroke-dasharray="2 2"/>
  <!-- Left pan -->
  <path d="M11 38 Q17 43.5 23 38" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- Right pan chains -->
  <line x1="47" y1="26.8" x2="44" y2="37" stroke="white" stroke-width="1.3" opacity="0.55" stroke-dasharray="2 2"/>
  <line x1="47" y1="26.8" x2="50" y2="37" stroke="white" stroke-width="1.3" opacity="0.55" stroke-dasharray="2 2"/>
  <!-- Right pan -->
  <path d="M41 37 Q47 42.5 53 37" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <!-- Base -->
  <rect x="28.5" y="44" width="7" height="2.5" rx="1.25" fill="white" opacity="0.5"/>
</svg>
